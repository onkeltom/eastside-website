# Konfiguration des Redaktionsbereichs (Sveltia CMS)
# Doku: https://sveltiacms.app/en/docs
backend:
  name: github
  repo: onkeltom/eastside-website
  branch: main
  # base_url: https://<dein-worker>.workers.dev   # GitHub-Login-Helfer (sveltia-cms-auth), später eintragen

media_folder: public/images/uploads
public_folder: /images/uploads
locale: de

collections:
  - name: news
    label: News & Berichte
    label_singular: Beitrag
    folder: src/content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: date, label: Datum, widget: datetime, time_format: false, format: "YYYY-MM-DD" }
      - { name: kategorie, label: Kategorie, widget: select, options: [Erfolg, Wettkampf, Verein, Training] }
      - { name: klasse, label: "Altersklasse (optional)", widget: string, required: false }
      - { name: fotos, label: "Anzahl Fotos (optional)", widget: number, value_type: int, required: false }
      - { name: teaser, label: Kurztext für die Übersicht, widget: text }
      - { name: quelle, label: "Adresse auf der alten Website (optional)", widget: string, required: false }
      - { name: draft, label: "Entwurf (nicht veröffentlichen)", widget: boolean, default: true }
      - { name: body, label: Text, widget: markdown }

  - name: daten
    label: Vereinsdaten
    files:
      - name: erfolge
        label: Erfolge / Ergebnisse
        file: src/data/erfolge.json
        fields:
          - name: items
            label: Ergebnisse
            widget: list
            root: true
            fields:
              - { name: platz, label: Platz, widget: string }
              - { name: datum, label: Datum, widget: string }
              - { name: saison, label: Saison, widget: number, value_type: int }
              - { name: wettkampf, label: Wettkampf, widget: string }
              - { name: klasse, label: Altersklasse, widget: string }
              - { name: stufen, label: "Stufen für den Filter", widget: select, multiple: true, options: [U8, U10, U12, "U14+"] }
              - { name: disziplin, label: Disziplin, widget: string }
              - { name: wer, label: "Athlet:in / Team (nur mit Einwilligung)", widget: string }
              - { name: art, label: "Einzel oder Team", widget: select, options: [Einzel, Team] }
              - { name: meisterschaft, label: "Berliner Meisterschaft", widget: boolean, default: false }
              - { name: highlight, label: Highlight, widget: boolean, default: false }
              - { name: link, label: "Link zur Ergebnisliste", widget: string, required: false }
      - name: gruppen
        label: Gruppen & freie Plätze
        file: src/data/gruppen.json
        fields:
          - name: items
            label: Gruppen
            widget: list
            root: true
            fields:
              - { name: id, label: Kürzel, widget: string }
              - { name: name, label: Name, widget: string }
              - { name: jahrgaenge, label: Jahrgänge, widget: list, field: { name: jahr, label: Jahr, widget: number, value_type: int } }
              - { name: status, label: Status, widget: select, options: [{ label: "Plätze frei", value: frei }, { label: Warteliste, value: warteliste }] }
              - { name: stufe, label: Stufe, widget: string }
              - { name: sommer, label: "Zeiten Sommer", widget: string }
              - { name: winter, label: "Zeiten Winter", widget: string }
              - { name: tage, label: Trainingstage, widget: string }
              - { name: trainer, label: "Trainer:in", widget: string }
              - { name: hinweis, label: "Hinweis (optional)", widget: string, required: false }
      - name: termine
        label: Termine
        file: src/data/termine.json
        fields:
          - name: items
            label: Termine
            widget: list
            root: true
            fields:
              - { name: datum, label: Datum, widget: string }
              - { name: titel, label: Titel, widget: string }
      - name: partner
        label: Partner & Sponsoren
        file: src/data/partner.json
        fields:
          - name: items
            label: Partner
            widget: list
            root: true
            fields:
              - { name: name, label: Name, widget: string }
              - { name: url, label: Website, widget: string }
              - { name: logo, label: "Logo (optional)", widget: image, required: false }
      - name: beitraege
        label: Beiträge & Mitgliedschaft
        file: src/data/beitraege.json
        fields:
          - { name: gueltig_ab, label: "Beitragsordnung gültig ab", widget: string }
          - name: tarife
            label: Tarife
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: fuer, label: Für, widget: string }
              - { name: monat, label: "Pro Monat", widget: string }
              - { name: jahr, label: "Pro Jahr", widget: string }
          - { name: aufnahmegebuehr, label: Aufnahmegebühr, widget: string }
          - { name: probetraining, label: Probetraining, widget: string }
          - { name: inklusive, label: "Inklusive", widget: list }
          - name: schritte
            label: "So wirst du Mitglied"
            widget: list
            fields:
              - { name: titel, label: Titel, widget: string }
              - { name: text, label: Text, widget: text }
          - name: fragen
            label: Fragen
            widget: list
            fields:
              - { name: frage, label: Frage, widget: string }
              - { name: antwort, label: Antwort, widget: text }
          - { name: antrag_url, label: "Mitgliedsantrag (PDF-Link)", widget: string }
          - { name: antrag_hinweis, label: "Hinweis zum Antrag", widget: string, required: false }
          - name: personal_training
            label: Personal Training
            widget: object
            fields:
              - { name: titel, label: Titel, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: preis, label: Preis, widget: string }
              - { name: hinweis, label: Hinweis, widget: string, required: false }
      - name: kinderschutz
        label: Kinderschutz
        file: src/data/kinderschutz.json
        fields:
          - { name: kurz, label: "Kurzsatz (Startseite, Mitmachen)", widget: string }
          - { name: haltung, label: "Haltung (Absätze)", widget: list, field: { name: absatz, label: Absatz, widget: text } }
          - name: ansprechpersonen
            label: Ansprechpersonen
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: rolle, label: Rolle, widget: string }
              - { name: email, label: E-Mail, widget: string }
          - { name: ansprech_hinweis, label: "Hinweis zu den Ansprechpersonen", widget: text }
          - name: ehrenkodex
            label: Ehrenkodex
            widget: object
            fields:
              - { name: text, label: Text, widget: markdown }
              - { name: hinweis, label: Hinweis, widget: string }
          - name: massnahmen
            label: "Was wir tun"
            widget: list
            fields:
              - { name: titel, label: Titel, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: status, label: "Status (erst auf umgesetzt setzen, wenn erledigt)", widget: select, options: [offen, umgesetzt] }
          - name: hilfe
            label: Hilfe von außen
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: text, label: Text, widget: string }
              - { name: tel, label: Telefon, widget: string, required: false }
              - { name: url, label: Website, widget: string, required: false }
          - { name: hilfe_hinweis, label: "Hinweis", widget: string, required: false }
          - { name: downloads, label: Downloads, widget: string }
