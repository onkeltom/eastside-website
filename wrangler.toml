# Cloudflare Pages: Bindings und Variablen für die Functions in functions/.
# Einrichtung Schritt für Schritt: docs/einreichen-einrichten.md
name = "eastside-website"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[vars]
GITHUB_REPO = "onkeltom/eastside-website"
GITHUB_APP_ID = "5949046"
GITHUB_INSTALLATION_ID = "186411278"
ACCESS_TEAM_DOMAIN = "https://blue-shadow-7022.cloudflareaccess.com"
ACCESS_AUD = "ba50730655da088f7c8d600418cd007a35a5f01dff18173a13c8d6e63a2f41d0"
FOTOS_NUR_MIT_LOGIN = "false"
ANFRAGE_ABSENDER = "formular@sc-eastside.de"
ANFRAGE_EMPFAENGER = "sc.east.side2023@gmail.com"

[[r2_buckets]]
binding = "FOTOS"
bucket_name = "eastside-fotos"
# Daten von Kindern nur auf Servern in der EU: Bucket mit Jurisdiction EU anlegen.
jurisdiction = "eu"

# Vorschau-Versionen (jeder Pull Request): Fotos nur mit Login, da dort noch ungeprüfte Fotos liegen.
[env.preview.vars]
GITHUB_REPO = "onkeltom/eastside-website"
GITHUB_APP_ID = "5949046"
GITHUB_INSTALLATION_ID = "186411278"
ACCESS_TEAM_DOMAIN = "https://blue-shadow-7022.cloudflareaccess.com"
ACCESS_AUD = "8d5e351ad561bc72e1cff72833bb813b74c57c8668e6b73ac786e563a28dda8f"
FOTOS_NUR_MIT_LOGIN = "true"

[[env.preview.r2_buckets]]
binding = "FOTOS"
bucket_name = "eastside-fotos"
# Daten von Kindern nur auf Servern in der EU: Bucket mit Jurisdiction EU anlegen.
jurisdiction = "eu"

# Formular /mitmachen/ (Probetraining, Warteliste) → E-Mail an den Verein. Einrichtung: docs/anfrage-einrichten.md
# Nur im Livebetrieb: Vorschau-Versionen haben kein Binding, dort öffnet das Formular das E-Mail-Programm.
[[send_email]]
name = "ANFRAGEN"
destination_address = "sc.east.side2023@gmail.com"
